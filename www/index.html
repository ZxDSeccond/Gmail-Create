<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Gmail Bot - ZxD</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #00ffcc;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #00ffcc;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }
        button:active {
            background: #00ccb1;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤖 Auto Gmail Bot</h2>
        
        <div class="input-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="Contoh: Zidan" value="Zidan">
        </div>
        
        <div class="input-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Contoh: ZxD" value="ZxD">
        </div>
        
        <div class="input-group">
            <label>Username Gmail</label>
            <input type="text" id="username" placeholder="username_tanpa_gmail">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Password akun">
        </div>
        
        <button onclick="jalankanBot()">Kirim ke Colab</button>
        
        <div id="status"></div>
    </div>

    <script>
        async function jalankanBot() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = "⏳ Mengirim data ke server Colab...";
            statusDiv.style.color = "#ffaa00";

            const payload = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                // URL Static Ngrok kamu yang sudah permanen
                let response = await fetch('https://crusted-unwidened-ishaan.ngrok-free.dev/create-gmail', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                let hasil = await response.json();
                
                if (response.ok) {
                    statusDiv.innerHTML = "✅ Berhasil! " + (hasil.message || "Playwright jalan.");
                    statusDiv.style.color = "#00ffcc";
                } else {
                    statusDiv.innerHTML = "❌ Gagal: " + (hasil.message || "Error dari server");
                    statusDiv.style.color = "#ff5555";
                }
            } catch (error) {
                console.error("Network Error:", error);
                statusDiv.innerHTML = "❌ Gagal terhubung! Cek koneksi / Colab mati.";
                statusDiv.style.color = "#ff5555";
            }
        }
    </script>
</body>
</html>
